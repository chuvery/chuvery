<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="googlebot" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#f5f2ed" />
  <title>지성패키지 | 홈페이지 준비 중</title>
  <meta name="description" content="지성패키지 홈페이지를 준비 중입니다. 문의: yeoul@yeoullab.com" />

  <style>
    :root{
      --paper:#f4f1ec;
      --ink:#181818;
      --muted:#73706b;
      --line:rgba(24,24,24,.12);
      --red:#e2262d;
      --white:#fff;
    }

    *{box-sizing:border-box}
    html{background:var(--paper)}
    body{
      margin:0;
      min-height:100vh;
      min-height:100svh;
      color:var(--ink);
      background:
        linear-gradient(rgba(255,255,255,.42), rgba(255,255,255,.42)),
        var(--paper);
      font-family:
        Pretendard, "Noto Sans KR", "Apple SD Gothic Neo",
        "Malgun Gothic", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    a{color:inherit}

    .shell{
      min-height:100vh;
      min-height:100svh;
      display:grid;
      grid-template-rows:auto 1fr auto;
      padding:28px clamp(22px,4vw,60px) 24px;
      overflow:hidden;
      position:relative;
    }

    /* packaging-inspired background lines */
    .art{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }

    .art::before,
    .art::after{
      content:"";
      position:absolute;
      border:1px solid rgba(24,24,24,.08);
      transform:rotate(-7deg);
    }

    .art::before{
      width:min(48vw,720px);
      aspect-ratio:1/.62;
      right:-10vw;
      top:11vh;
      border-radius:34px;
    }

    .art::after{
      width:min(34vw,480px);
      aspect-ratio:1/.62;
      right:5vw;
      top:22vh;
      border-radius:28px;
      box-shadow:
        0 0 0 42px rgba(255,255,255,.16),
        0 0 0 86px rgba(24,24,24,.018);
    }

    .bar{
      position:absolute;
      right:clamp(40px,8vw,120px);
      bottom:8vh;
      width:min(34vw,500px);
      height:10px;
      background:var(--red);
      border-radius:999px;
      opacity:.95;
      transform:rotate(-7deg);
    }

    header,main,footer{position:relative;z-index:2}

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      min-height:48px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      text-decoration:none;
    }

    .brand-mark{
      width:14px;
      height:14px;
      background:var(--red);
      border-radius:2px;
      transform:rotate(45deg);
      flex:0 0 auto;
    }

    .brand-text{
      display:flex;
      flex-direction:column;
      line-height:1.05;
    }

    .brand-ko{
      font-size:19px;
      font-weight:800;
      letter-spacing:-.04em;
    }

    .brand-en{
      margin-top:5px;
      font-size:9px;
      font-weight:800;
      letter-spacing:.22em;
      color:#6c6964;
    }

    .status{
      display:inline-flex;
      align-items:center;
      gap:9px;
      font-size:11px;
      font-weight:800;
      letter-spacing:.14em;
      color:#817d77;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .status i{
      display:block;
      width:7px;
      height:7px;
      border-radius:99px;
      background:var(--red);
      box-shadow:0 0 0 5px rgba(226,38,45,.08);
    }

    main{
      display:flex;
      align-items:center;
      padding:clamp(64px,10vh,120px) 0;
    }

    .hero{
      width:min(820px, 82vw);
    }

    .kicker{
      margin:0 0 20px;
      color:var(--red);
      font-size:12px;
      font-weight:900;
      letter-spacing:.20em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      max-width:760px;
      font-size:clamp(44px,7vw,92px);
      line-height:.99;
      font-weight:800;
      letter-spacing:-.07em;
      word-break:keep-all;
    }

    .sub{
      margin:28px 0 0;
      max-width:600px;
      color:var(--muted);
      font-size:clamp(16px,1.6vw,20px);
      line-height:1.75;
      letter-spacing:-.02em;
      word-break:keep-all;
    }

    .contact-row{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:14px 20px;
      margin-top:42px;
    }

    .contact{
      display:inline-flex;
      align-items:center;
      gap:12px;
      min-height:56px;
      padding:0 22px;
      border:1px solid var(--ink);
      border-radius:999px;
      background:rgba(255,255,255,.62);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      text-decoration:none;
      font-size:15px;
      font-weight:800;
      transition:
        transform .18s ease,
        background .18s ease,
        color .18s ease;
    }

    .contact:hover,
    .contact:focus-visible{
      transform:translateY(-2px);
      background:var(--ink);
      color:var(--white);
      outline:none;
    }

    .contact svg{
      width:18px;
      height:18px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .note{
      color:#8c8881;
      font-size:12px;
      line-height:1.6;
    }

    footer{
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding-top:18px;
      border-top:1px solid var(--line);
      color:#98938c;
      font-size:11px;
      letter-spacing:.02em;
    }

    footer strong{
      color:#5e5b57;
      font-weight:800;
    }

    @media (max-width:820px){
      .shell{padding:22px 20px 18px}
      .art::before{
        width:78vw;
        right:-35vw;
        top:18vh;
        opacity:.75;
      }
      .art::after{
        width:62vw;
        right:-16vw;
        top:26vh;
        opacity:.7;
      }
      .bar{
        width:54vw;
        right:-8vw;
        bottom:12vh;
      }
      main{padding:64px 0 78px}
      .hero{width:100%}
      h1{max-width:640px}
    }

    @media (max-width:560px){
      header{align-items:flex-start}
      .brand-ko{font-size:17px}
      .brand-en{font-size:8px}
      .status{font-size:9px;gap:7px}
      .status i{width:6px;height:6px;box-shadow:0 0 0 4px rgba(226,38,45,.08)}
      main{align-items:flex-start;padding:18vh 0 14vh}
      .kicker{font-size:10px;margin-bottom:17px}
      h1{
        font-size:clamp(42px,14vw,66px);
        line-height:1.02;
        letter-spacing:-.075em;
      }
      .sub{
        margin-top:22px;
        font-size:15px;
        max-width:92%;
      }
      .contact-row{
        align-items:flex-start;
        flex-direction:column;
        margin-top:34px;
      }
      .contact{
        width:100%;
        justify-content:center;
        min-height:54px;
        font-size:14px;
      }
      footer{
        align-items:flex-end;
        font-size:9.5px;
      }
      footer span:last-child{text-align:right}
      .art::before{top:30vh}
      .art::after{top:37vh}
      .bar{bottom:19vh}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>

<body>
  <div class="shell">
    <div class="art" aria-hidden="true"><span class="bar"></span></div>

    <header>
      <div class="brand" aria-label="지성패키지">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-ko">지성패키지</span>
          <span class="brand-en">JISEONG PACKAGE</span>
        </span>
      </div>

      <div class="status" aria-label="홈페이지 준비 중">
        <i aria-hidden="true"></i>
        Website in progress
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="kicker">Jiseong Package</p>

        <h1 id="page-title">
          새로운 홈페이지를<br />
          준비하고 있습니다.
        </h1>

        <p class="sub">
          지성패키지의 제품과 정보를 더 편리하게 확인하실 수 있도록
          홈페이지를 새롭게 정비하고 있습니다.
        </p>

        <div class="contact-row">
          <a class="contact" href="mailto:yeoul@yeoullab.com">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
            yeoul@yeoullab.com
          </a>
          <span class="note">홈페이지 관련 문의</span>
        </div>
      </section>
    </main>

    <footer>
      <span><strong>JISEONG PACKAGE</strong></span>
      <span>© 2026 Jiseong Package. All rights reserved.</span>
    </footer>
  </div>
</body>
</html>
