<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>공지 관리 | 지성패키지</title><link rel="stylesheet" href="/assets/admin.css"></head><body><nav><a href="/">지성패키지 홈</a></nav><h1>공지사항 관리</h1><p id="status" role="status" aria-live="polite"></p><section id="signin"><form id="login"><label>관리자 아이디<input id="username" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section><section id="workspace" hidden><button id="logout">로그아웃</button><h2>공지 작성·수정</h2><form id="editor"><input id="noticeid" type="hidden"><label>제목<input id="title" maxlength="160" required></label><label>내용<textarea id="body" maxlength="10000" required></textarea></label><label><input id="published" type="checkbox" class="check-input"> 공개</label><button>저장</button><button type="button" id="reset">새 공지</button></form><h2>등록된 공지</h2><div id="notices"></div></section><script src="/assets/admin.js" defer></script></body></html>
