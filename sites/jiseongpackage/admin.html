<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>지성패키지 관리자</title><link rel="stylesheet" href="/assets/admin.css"></head><body><main class="panel"><h1>지성패키지 관리자</h1><p id="message" role="status" aria-live="polite"></p><section id="login"><h2>관리자 로그인</h2><form id="login-form"><label>이메일<input type="email" name="email" autocomplete="username" required></label><label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label><button>로그인</button></form></section><section id="workspace" hidden><div class="toolbar"><h2>공지사항 관리</h2><button type="button" id="logout">로그아웃</button></div><form id="notice-form"><input type="hidden" name="id"><label>제목<input type="text" name="title" maxlength="140" required></label><label>본문<textarea name="body" maxlength="20000" rows="9" required></textarea></label><label class="check"><input type="checkbox" name="is_published"> 홈페이지에 공개</label><div class="toolbar"><button type="submit">저장</button><button type="button" id="clear">새 글</button></div></form><h2>작성된 글</h2><div id="notices"></div></section></main><script src="/assets/admin.js" defer></script></body></html>
