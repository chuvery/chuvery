</nav></details></div></header><main id="admin-main" class="admin-main"><div class="admin-shell"><div class="admin-title"><p class="eyebrow">MANAGEMENT</p><h1>공지사항 관리</h1><p>공지 등록과 홈페이지 팝업을 관리합니다.</p></div><p id="status" role="status" aria-live="polite"></p><section id="signin" class="admin-panel"><form id="login"><label>관리자 아이디<input id="username" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section><section id="workspace" hidden><div class="admin-toolbar"><button id="logout" type="button">로그아웃</button></div><div class="admin-panel"><h2>공지 작성·수정</h2><form id="editor"><input id="noticeid" type="hidden"><label>제목<input id="title" maxlength="160" required></label><label>내용<textarea id="body" maxlength="10000" required></textarea></label><label><input id="published" type="checkbox" class="check-input"> 공개</label><fieldset><legend>공지 이미지</legend><input type="hidden" id="image_key"><label>이미지 파일(PNG·JPG·WebP, 원본 최대 12MB · 자동 최적화)<input type="file" id="image_file" accept="image/png,image/jpeg,image/webp"></label><button type="button" id="upload_image">이미지 올리기</button><button type="button" id="remove_image">이미지 연결 해제</button><p id="image_state" role="status"></p></fieldset><fieldset><legend>홈페이지 팝업</legend><label><input id="popup_enabled" type="checkbox" class="check-input"> 공지 팝업으로 표시</label><label>시작일<input id="popup_start" type="date"></label><label>종료일<input id="popup_end" type="date"></label><p>공개 상태인 공지만 지정 기간에 표시됩니다.</p></fieldset><button>저장</button><button type="button" id="reset">새 공지</button></form></div><div class="admin-panel"><h2>등록된 공지</h2><div id="notices"></div></div></section></div></main><script src="/assets/admin.js" defer></script></body></html>
